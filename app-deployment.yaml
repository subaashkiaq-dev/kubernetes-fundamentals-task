apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: assessment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assessment-app
  template:
    metadata:
      labels:
        app: assessment-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
