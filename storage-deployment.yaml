apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-deployment
  namespace: assessment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-nginx
  template:
    metadata:
      labels:
        app: storage-nginx
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          volumeMounts:
            - name: storage
              mountPath: /usr/share/nginx/html
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: assessment-pvc
